# /etc/nginx/sites-available/id412-socket on the shared server (a copy, for the record).
# Nginx receives https://id412-socket.xdlab.net and passes it to the relay on port 4002.
# Certbot adds the "listen 443 ssl" and certificate lines to the file on the server.
server {
    server_name id412-socket.xdlab.net;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 80;
    listen [::]:80;
}
